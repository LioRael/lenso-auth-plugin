[workspace]
resolver="2"
members=["host"]
[workspace.dependencies]
lenso-kernel="=0.3.6"
lenso-app-plan="0.4.1"
lenso-native-adapter="0.3.13"
futures="0.3"
serde={version="1",features=["derive"]}
serde_json="1"
wasm-bindgen="=0.2.127"
wasm-bindgen-futures="=0.4.77"
js-sys="=0.3.104"
[patch.crates-io]
lenso={path="../../../../lenso-runtime-rust/design-workers-compatibility/crates/lenso"}
lenso-native-adapter={path="../../../../lenso-runtime-rust/design-workers-compatibility/crates/lenso-native-adapter"}
lenso-capability-http-endpoint={path="../../../../lenso-web/feat-workers-http-parity/crates/lenso-capability-http-endpoint"}
lenso-capability-http-client={path="../../../../lenso-web/feat-workers-http-parity/crates/lenso-capability-http-client"}
