[workspace]
resolver="2"
members=["host"]
[workspace.dependencies]
lenso-kernel="=0.3.6"
lenso-app-plan="0.4.1"
lenso-native-adapter="0.3.13"
futures="0.3"
serde={version="1",features=["derive"]}
serde_json="1"
wasm-bindgen="=0.2.127"
wasm-bindgen-futures="=0.4.77"
js-sys="=0.3.104"

[patch.crates-io]
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust", rev = "905a59141ca0e349b734fb7de99d010f2b0dc0df" }
