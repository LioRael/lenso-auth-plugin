[package]
name="lenso-workers-g4-host"
version="0.1.0"
edition="2024"
publish=false
[lib]
crate-type=["cdylib"]
[dependencies]
lenso-kernel.workspace=true
lenso-app-plan.workspace=true
lenso-native-adapter.workspace=true
futures.workspace=true
serde.workspace=true
serde_json.workspace=true
wasm-bindgen.workspace=true
wasm-bindgen-futures.workspace=true
js-sys.workspace=true
lenso-capability-secrets="0.1.4"
time={version="0.3",features=["formatting","parsing","wasm-bindgen"]}
lenso-auth-account-plugin={path="../../../crates/lenso-auth-account-plugin",default-features=false,features=["workers"]}
lenso-auth-oauth-flow-plugin={path="../../../crates/lenso-auth-oauth-flow-plugin",default-features=false,features=["workers"]}
lenso-auth-web-session-plugin={path="../../../crates/lenso-auth-web-session-plugin",default-features=false,features=["workers"]}
lenso-auth-oidc-client-plugin={path="../../../crates/lenso-auth-oidc-client-plugin",default-features=false,features=["workers"]}
lenso-auth-router-plugin={path="../../../crates/lenso-auth-router-plugin"}
lenso-capability-auth={path="../../../crates/lenso-capability-auth"}
lenso-capability-identity-directory={path="../../../crates/lenso-capability-identity-directory"}
lenso-capability-credential-issuer={path="../../../crates/lenso-capability-credential-issuer"}
lenso-capability-account-admin={path="../../../crates/lenso-capability-account-admin"}
lenso-capability-auth-delegation={path="../../../crates/lenso-capability-auth-delegation"}
lenso-capability-oauth-flow={path="../../../crates/lenso-capability-oauth-flow"}

http="1"
bytes="1"
lenso-capability-http-endpoint="0.3.1"
lenso-capability-http-client="0.3.0"
lenso-capability-federated-auth={path="../../../crates/lenso-capability-federated-auth"}
lenso-auth-sdk={path="../../../crates/lenso-auth-sdk"}
lenso-web-ingress-plugin={version="0.4.2",default-features=false}
lenso-http-egress-plugin={version="0.3.1",default-features=false,features=["workers"]}

lenso-workers-driver="0.1.0"
lenso-auth-password-plugin={path="../../../crates/lenso-auth-password-plugin",default-features=false,features=["workers"]}
lenso-auth-phone-plugin={path="../../../crates/lenso-auth-phone-plugin",default-features=false,features=["workers"]}
lenso-auth-device-plugin={path="../../../crates/lenso-auth-device-plugin",default-features=false,features=["workers"]}
lenso-auth-api-token-plugin={path="../../../crates/lenso-auth-api-token-plugin",default-features=false,features=["workers"]}
lenso-auth-oidc-plugin={path="../../../crates/lenso-auth-oidc-plugin",default-features=false,features=["workers"]}
lenso-capability-password-auth={path="../../../crates/lenso-capability-password-auth"}
lenso-capability-phone-auth={path="../../../crates/lenso-capability-phone-auth"}
lenso-capability-device-auth={path="../../../crates/lenso-capability-device-auth"}
lenso-capability-oidc-provider={path="../../../crates/lenso-capability-oidc-provider"}
lenso-capability-sms-delivery={path="../../../crates/lenso-capability-sms-delivery"}
