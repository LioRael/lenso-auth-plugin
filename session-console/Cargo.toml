[package]
name = "lenso-auth-session-console-plugin"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]
resolver = "2"

[package.metadata.lenso]
plugin-id = "lenso.auth.session-console"
root-slot = "console-global-extensions"

[dependencies]
base64 = "0.22"
lenso = "=0.5.29"
lenso-kernel = "=0.3.12"
lenso-capability-ui-global-contribution = { git = "https://github.com/LioRael/lenso-console", rev = "f27b0edba5cbbb3120955a6614cafc3ca3d4565e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
