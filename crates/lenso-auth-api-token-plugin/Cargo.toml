[package]
name = "lenso-auth-api-token-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "PostgreSQL-backed opaque API token Auth Plugin for Lenso vNext."

[package.metadata.lenso]
plugin-id = "lenso.auth.api-token"
root-slot = "auth"

[dependencies]
lenso.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
lenso-auth-sdk = { path = "../lenso-auth-sdk", version = "0.2.3" }
lenso-capability-auth = { path = "../lenso-capability-auth", version = "0.2.0" }
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
lenso-runner.workspace = true
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
