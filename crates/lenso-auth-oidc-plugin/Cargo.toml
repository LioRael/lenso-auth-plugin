[package]
name="lenso-auth-oidc-plugin"
version="0.1.0"
edition.workspace=true
license.workspace=true
publish=false
repository.workspace=true
[package.metadata.lenso]
plugin-id = "lenso.auth.oidc"
root-slot = "auth"

[dependencies]
lenso.workspace = true
base64.workspace=true
getrandom.workspace=true
hmac.workspace=true
jsonwebtoken.workspace=true
lenso-capability-credential-issuer={path="../lenso-capability-credential-issuer"}
lenso-capability-identity-directory={path="../lenso-capability-identity-directory"}
lenso-capability-oidc-provider={path="../lenso-capability-oidc-provider"}
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace=true
serde_json.workspace=true
sha2.workspace=true

thiserror.workspace=true
time.workspace=true
zeroize.workspace=true
[dev-dependencies]
tokio={version="1.52",features=["macros","rt"]}
[lints]
workspace=true
