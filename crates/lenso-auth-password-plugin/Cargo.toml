[package]
name = "lenso-auth-password-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Password registration and login Plugin for Lenso."

[package.metadata.lenso]
plugin-id = "lenso.auth.password"
root-slot = "auth-methods"

[package.metadata.lenso.host-facilities.state]
native = "host_facilities::state"
workers = "host_facilities::state"
workers-adapter = "src/host_facilities/state.mjs"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "dep:lenso-postgres-kit", "tokio/rt"]
workers = ["dep:lenso-migration", "dep:lenso-migration-d1", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "getrandom/wasm_js", "time/wasm-bindgen"]

[dependencies]
lenso-migration = { workspace = true, optional = true }
lenso-migration-d1 = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
lenso.workspace = true
argon2.workspace = true
getrandom.workspace = true
lenso-capability-credential-issuer = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.3.0" }
lenso-capability-identity-directory = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.3.0" }
lenso-capability-managed-session = { path = "../lenso-capability-managed-session", version = "0.1.0" }
lenso-capability-password-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.3.0" }
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio = { version = "1.52", features = ["sync"] }
zeroize.workspace = true

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lenso-app-plan.workspace = true
lenso-test.workspace = true

[lints]
workspace = true
