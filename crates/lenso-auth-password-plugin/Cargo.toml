[package]
name = "lenso-auth-password-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Password registration and login Plugin for Lenso vNext."

[package.metadata.lenso]
plugin-id = "lenso.auth.password"
root-slot = "auth-methods"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "dep:lenso-postgres-kit", "tokio/rt"]
workers = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "getrandom/wasm_js", "time/wasm-bindgen"]

[dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
lenso.workspace = true
argon2.workspace = true
getrandom.workspace = true
lenso-capability-credential-issuer = { path = "../lenso-capability-credential-issuer", version = "0.3.0" }
lenso-capability-identity-directory = { path = "../lenso-capability-identity-directory", version = "0.3.0" }
lenso-capability-password-auth = { path = "../lenso-capability-password-auth", version = "0.3.0" }
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio = { version = "1.52", features = ["sync"] }
zeroize.workspace = true

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "time"] }

[lints]
workspace = true
