[package]
name="lenso-auth-operator-session-plugin"
version="0.1.0"
edition.workspace=true
license.workspace=true
repository.workspace=true
publish=false
description="Controlled existing-account operator binding and login workflow."
[package.metadata.lenso]
plugin-id="lenso.auth.operator-session"
root-slot="auth"
[features]
workers=["time/wasm-bindgen"]
[dependencies]
lenso.workspace=true
lenso-kernel.workspace=true
lenso-auth-sdk={path="../lenso-auth-sdk",version="0.2.4"}
lenso-capability-auth={path="../lenso-capability-auth",version="0.2.0"}
lenso-capability-credential-state={path="../lenso-capability-credential-state",version="0.1.0"}
lenso-capability-credential-issuer={path="../lenso-capability-credential-issuer",version="0.3.0"}
lenso-capability-operator-binding={path="../lenso-capability-operator-binding",version="0.1.0"}
lenso-capability-operator-session={path="../lenso-capability-operator-session",version="0.1.0"}
lenso-capability-access-control={git="https://github.com/LioRael/lenso-access-control-plugin",rev="94b6d06cff1e6f17a06e771df232f662cae28ad5",version="0.2.0"}
lenso-capability-access-control-admin={git="https://github.com/LioRael/lenso-access-control-plugin",rev="94b6d06cff1e6f17a06e771df232f662cae28ad5",version="0.2.0"}
lenso-capability-audit-log={git="https://github.com/LioRael/lenso-audit-log-plugin",rev="83b4e52e8c6eaf2bbe5356dccd1e3a59b872c8e9",version="0.1.1"}
serde.workspace=true
serde_json.workspace=true
time.workspace=true
[lints]
workspace=true
