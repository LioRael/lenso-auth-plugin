[package]
name = "lenso-auth-account-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Identity directory and session credential issuer Plugin for Lenso."

[package.metadata.lenso]
plugin-id = "lenso.auth.account"
root-slot = "identity"

[package.metadata.lenso.host-facilities.state]
native = "host_facilities::state"
workers = "host_facilities::state"
workers-adapter = "src/host_facilities/state.mjs"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "dep:lenso-postgres-kit"]
workers = ["dep:lenso-migration", "dep:lenso-migration-d1", "dep:getrandom02", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "getrandom/wasm_js", "time/wasm-bindgen"]

[dependencies]
lenso-migration = { workspace = true, optional = true }
lenso-migration-d1 = { workspace = true, optional = true }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
lenso.workspace = true
url.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.2.4" }
lenso-capability-account-admin = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.1.0" }
lenso-capability-auth-delegation = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.1.0" }
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.2.0" }
lenso-capability-credential-state = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.1.0" }
lenso-capability-credential-issuer = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.3.0" }
lenso-capability-identity-directory = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "699bd9621bc2e7f8581f6c0ff0bcbfcb6e3c2167", version = "0.3.0" }
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
