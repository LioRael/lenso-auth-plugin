[package]
name = "lenso-auth-account-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Identity directory and session credential issuer Plugin for Lenso vNext."

[package.metadata.lenso]
plugin-id = "lenso.auth.account"
root-slot = "identity"

[dependencies]
lenso.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
lenso-auth-sdk = { path = "../lenso-auth-sdk", version = "0.2.3" }
lenso-capability-account-admin = { path = "../lenso-capability-account-admin" }
lenso-capability-auth = { path = "../lenso-capability-auth", version = "0.2.0" }
lenso-capability-credential-issuer = { path = "../lenso-capability-credential-issuer", version = "0.3.0" }
lenso-capability-identity-directory = { path = "../lenso-capability-identity-directory", version = "0.3.0" }
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
