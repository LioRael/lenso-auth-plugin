[package]
name="lenso-auth-oauth-flow-plugin"
version="0.1.0"
edition.workspace=true
license.workspace=true
publish=false
repository.workspace=true
[package.metadata.lenso]
plugin-id = "lenso.auth.oauth-flow"
root-slot = "oauth-flows"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "dep:lenso-postgres-kit"]
workers = ["dep:lenso-migration", "dep:lenso-migration-d1", "dep:getrandom02", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "getrandom/wasm_js", "time/wasm-bindgen"]

[dependencies]
lenso-migration = { workspace = true, optional = true }
lenso-migration-d1 = { workspace = true, optional = true }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
lenso.workspace = true
aes-gcm.workspace=true
base64.workspace=true
getrandom.workspace=true
hmac.workspace=true
lenso-capability-oauth-flow={path="../lenso-capability-oauth-flow",version="0.1.0"}
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit = { workspace = true, optional = true }
serde.workspace=true
serde_json.workspace=true
sha2.workspace=true
sqlx = { workspace = true, optional = true }
time.workspace=true
thiserror.workspace=true
zeroize.workspace=true
[dev-dependencies]
tokio={version="1.52",features=["macros","rt"]}
[lints]
workspace=true
