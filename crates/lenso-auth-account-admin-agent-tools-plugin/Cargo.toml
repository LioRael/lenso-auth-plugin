[package]
name = "lenso-auth-account-admin-agent-tools-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Agent Tool adapter for Lenso Auth account administration."

[package.metadata.lenso]
plugin-id = "lenso.auth.account-admin.agent-tools"
root-slot = "tool-providers"

[dependencies]
futures.workspace = true
lenso.workspace = true
lenso-capability-account-admin = { path = "../lenso-capability-account-admin" }
lenso-capability-agent-tool-provider.workspace = true
lenso-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lenso-capability-auth-delegation = { path = "../lenso-capability-auth-delegation" }
lenso-app-plan.workspace = true
lenso-auth-account-plugin = { path = "../lenso-auth-account-plugin" }
lenso-capability-auth = { path = "../lenso-capability-auth" }
lenso-capability-credential-issuer = { path = "../lenso-capability-credential-issuer" }
lenso-capability-identity-directory = { path = "../lenso-capability-identity-directory" }
lenso-capability-secrets.workspace = true
lenso-native-adapter.workspace = true
lenso-runner.workspace = true
sqlx.workspace = true
time.workspace = true
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
