[package]
name="lenso-auth-phone-plugin"
version="0.1.0"
edition.workspace=true
license.workspace=true
publish=false
repository.workspace=true
[package.metadata.lenso]
plugin-id = "lenso.auth.phone"
root-slot = "auth-methods"

[dependencies]
lenso.workspace = true
argon2.workspace=true
base64.workspace=true
getrandom.workspace=true
hmac.workspace=true
lenso-capability-credential-issuer={path="../lenso-capability-credential-issuer"}
lenso-capability-identity-directory={path="../lenso-capability-identity-directory"}
lenso-capability-phone-auth={path="../lenso-capability-phone-auth"}
lenso-capability-secrets.workspace = true
lenso-capability-sms-delivery={path="../lenso-capability-sms-delivery"}
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace=true
serde_json.workspace=true
sha2.workspace=true

thiserror.workspace=true
time.workspace=true
tokio={version="1.52",features=["rt","sync"]}
zeroize.workspace=true
[dev-dependencies]
tokio={version="1.52",features=["macros","rt","time"]}
[lints]
workspace=true
