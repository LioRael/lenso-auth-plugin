[package]
name="lenso-auth-phone-plugin"
version="0.1.0"
edition.workspace=true
license.workspace=true
publish=false
repository.workspace=true
[package.metadata.lenso]
plugin-id = "lenso.auth.phone"
root-slot = "auth-methods"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "dep:lenso-postgres-kit", "tokio/rt"]
workers = ["dep:lenso-migration", "dep:lenso-migration-d1", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "getrandom/wasm_js", "time/wasm-bindgen"]

[dependencies]
lenso-migration = { workspace = true, optional = true }
lenso-migration-d1 = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
lenso.workspace = true
argon2.workspace=true
base64.workspace=true
getrandom.workspace=true
hmac.workspace=true
lenso-capability-credential-issuer={ path = "../lenso-capability-credential-issuer", version = "0.3.0" }
lenso-capability-identity-directory={ path = "../lenso-capability-identity-directory", version = "0.3.0" }
lenso-capability-phone-auth={ path = "../lenso-capability-phone-auth", version = "0.1.0" }
lenso-capability-secrets.workspace = true
lenso-capability-sms-delivery={ path = "../lenso-capability-sms-delivery", version = "0.1.0" }
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit = { workspace = true, optional = true }
serde.workspace=true
serde_json.workspace=true
sha2.workspace=true
sqlx = { workspace = true, optional = true }
thiserror.workspace=true
time.workspace=true
tokio={version="1.52",features=["sync"]}
zeroize.workspace=true
[dev-dependencies]
tokio={version="1.52",features=["macros","rt","time"]}
[lints]
workspace=true
