[package]
name = "lenso-auth-web-session-plugin"
version = "0.1.0"
description = "Browser OIDC session HTTP adapter for Lenso Auth."
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.auth.web-session"
root-slot = "auth"

[features]
workers = ["time/wasm-bindgen", "getrandom/wasm_js"]

[dependencies]
base64.workspace = true
getrandom.workspace = true
lenso.workspace = true
lenso-capability-credential-issuer = { path = "../lenso-capability-credential-issuer" }
lenso-capability-federated-auth = { path = "../lenso-capability-federated-auth" }
lenso-capability-http-endpoint.workspace = true
lenso-kernel.workspace = true
serde.workspace = true
time.workspace = true
url.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
lenso-native-adapter.workspace = true
lenso-runner.workspace = true
serde_json.workspace = true
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
