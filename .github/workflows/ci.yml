name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LENSO_POSTGRES_TEST_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: LioRael/lenso-runtime-rust
          ref: 905a59141ca0e349b734fb7de99d010f2b0dc0df
          path: .ci/runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install reviewed Runtime package
        run: npm install --ignore-scripts --no-save --package-lock=false --prefix workers "$GITHUB_WORKSPACE/.ci/runtime/packages/workers-runtime"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        run: cargo test --locked --workspace -- --include-ignored --test-threads=1
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check portable targets
        run: |
          cargo check --locked -p lenso-capability-auth -p lenso-auth-sdk --target wasm32-unknown-unknown
          cargo check --locked -p lenso-capability-auth -p lenso-auth-sdk --target wasm32-wasip2
      - name: Check Workers Auth implementations
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features workers -p lenso-auth-account-plugin -p lenso-auth-oauth-flow-plugin -p lenso-auth-web-session-plugin -p lenso-auth-oidc-client-plugin -p lenso-auth-router-plugin -p lenso-auth-password-plugin -p lenso-auth-phone-plugin -p lenso-auth-device-plugin -p lenso-auth-api-token-plugin -p lenso-auth-oidc-plugin -- -D warnings
      - name: Test Auth event storage lifetime
        run: node --test workers/d1-binding.test.mjs
      - name: Check extracted Workers Auth packages
        run: |
          cargo package --manifest-path .ci/runtime/Cargo.toml --no-verify -p lenso-native-adapter -p lenso-native-adapter-macros -p lenso-runtime-codec
          export RUNTIME_ARCHIVES="$GITHUB_WORKSPACE/.ci/runtime/target/package/lenso-native-adapter-0.3.13.crate:$GITHUB_WORKSPACE/.ci/runtime/target/package/lenso-native-adapter-macros-0.2.4.crate:$GITHUB_WORKSPACE/.ci/runtime/target/package/lenso-runtime-codec-0.4.1.crate"
          python3 workers/check-packages.py
      - name: Package public crates
        run: |
          # Package this same-release edge together; live publishing keeps the dependency order.
          cargo package --locked -p lenso-capability-auth -p lenso-auth-sdk
          cargo package --locked -p lenso-capability-credential-issuer
          cargo package --locked -p lenso-capability-identity-directory
          cargo package --locked -p lenso-capability-password-auth
