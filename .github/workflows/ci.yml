name: CI

on:
  push:
    branches:
      - 'candidate/**'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LENSO_POSTGRES_TEST_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify portable public-key actor binding
        run: node --test crates/lenso-auth-sdk/typescript/actor.test.ts
      - name: Install released Runtime package
        run: npm ci --ignore-scripts --prefix workers
      - name: Check generated private D1 bridges
        run: node workers/generate-bridges.mjs --check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace lifecycle and authorization
        run: cargo test --locked --workspace -- --include-ignored --test-threads=1
      - name: Fetch frozen synthetic managed-session App dependencies
        run: cargo fetch --manifest-path experiments/managed-session-app/Cargo.toml --locked
      - name: Test complete synthetic Native managed-session App and real Ingress
        run: cargo test --manifest-path experiments/managed-session-app/Cargo.toml --locked --offline --test native_ingress -- --ignored
      - name: Fetch frozen synthetic operator App dependencies
        run: cargo fetch --manifest-path experiments/operator-binding-app/Cargo.toml --locked
      - name: Test complete synthetic Native operator App
        run: cargo test --manifest-path experiments/operator-binding-app/Cargo.toml --locked --offline --test native_binding -- --ignored
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check portable Auth targets
        run: |
          cargo check --locked -p lenso-capability-auth -p lenso-auth-sdk --target wasm32-unknown-unknown
          cargo check --locked -p lenso-capability-auth -p lenso-auth-sdk --target wasm32-wasip2
      - name: Check Workers Auth implementations
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features workers -p lenso-auth-account-plugin -p lenso-auth-oauth-flow-plugin -p lenso-auth-web-session-plugin -p lenso-auth-oidc-client-plugin -p lenso-auth-router-plugin -p lenso-auth-password-plugin -p lenso-auth-phone-plugin -p lenso-auth-device-plugin -p lenso-auth-api-token-plugin -p lenso-auth-oidc-plugin -- -D warnings
      - name: Check generated D1 migration plans
        run: |
          python3 workers/generate-migrations.py --check
          python3 workers/test-migration-generation.py
      - name: Check renewal and operator workflow Workers implementations
        run: cargo clippy --locked --target wasm32-unknown-unknown --features workers -p lenso-auth-session-renewal-plugin -p lenso-auth-operator-session-plugin -- -D warnings
      - name: Install frozen synthetic managed-session App tooling
        run: npm ci --ignore-scripts --prefix experiments/managed-session-app
      - name: Install matching Wasm Bindgen test tool
        run: cargo install --locked --version 0.2.128 wasm-bindgen-cli
      - name: Test complete synthetic Workers managed-session App and real Ingress
        run: node experiments/managed-session-app/qualify-workers.mjs
      - name: Test browser renewal competition and response loss
        run: node --test crates/lenso-auth-session-renewal-plugin/browser/session-renewal.test.mjs
      - name: Fetch frozen synthetic Workers operator App dependencies
        run: cargo fetch --manifest-path experiments/operator-binding-workers-app/Cargo.toml --locked
      - name: Install frozen synthetic Workers operator App tooling
        run: npm ci --ignore-scripts --prefix experiments/operator-binding-workers-app
      - name: Install isolated matching operator Wasm Bindgen test tool
        run: cargo install --locked --version 0.2.127 --root "$RUNNER_TEMP/auth-operator-wasm-bindgen-0127" wasm-bindgen-cli
      - name: Test complete synthetic Workers operator App
        env:
          LENSO_WASM_BINDGEN: ${{ runner.temp }}/auth-operator-wasm-bindgen-0127/bin/wasm-bindgen
        run: node experiments/operator-binding-workers-app/qualify-workers.mjs /tmp/operator-workers-app.json
      - name: Test Auth event storage lifetime
        run: node --test workers/d1-binding.test.mjs
      - name: Verify source-selected D1 facility
        run: node --test crates/lenso-auth-api-token-plugin/tests/source-facility.test.mjs crates/lenso-auth-account-plugin/tests/source-facility.test.mjs crates/lenso-auth-password-plugin/tests/source-facility.test.mjs
      - name: Test Auth private storage reference selection
        run: cargo test --locked --no-default-features --features workers -p lenso-auth-account-plugin -p lenso-auth-password-plugin --lib storage_reference
      - name: Check extracted Workers Auth packages
        run: python3 workers/check-packages.py
      - name: Package changed public cohort
        run: cargo package --locked -p lenso-capability-credential-state -p lenso-capability-api-token-admin -p lenso-capability-human-api-token -p lenso-auth-sdk

  upstream_packages:
    name: Verify Auth Console upstream packages
    if: github.ref_name == 'candidate/auth-console-upstream'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - name: Verify exact upstream packages without upload
        run: |
          cargo publish --locked --dry-run -p lenso-auth-sdk
          cargo publish --locked --dry-run -p lenso-capability-account-admin
          cargo publish --locked --dry-run -p lenso-capability-credential-state
      - name: Retain verified upstream archives
        run: cargo package --locked -p lenso-auth-sdk -p lenso-capability-account-admin -p lenso-capability-credential-state
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auth-console-upstream-${{ github.sha }}
          path: |
            target/package/lenso-auth-sdk-0.2.4.crate
            target/package/lenso-capability-account-admin-0.1.0.crate
            target/package/lenso-capability-credential-state-0.1.0.crate
          if-no-files-found: error
