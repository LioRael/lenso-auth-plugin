name: Release-plz

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the landed source commit to verify and release
        required: true
        type: string
      release_set:
        description: JSON array of exact package_name/version objects
        required: true
        default: '[]'
        type: string
      scope:
        description: Existing workspace release or exact approved Auth Console stage
        required: true
        default: workspace
        type: choice
        options:
          - workspace
          - auth-console-upstream
          - account-console
      mode:
        description: Read-only by default; publish requires separate authorization
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirmation:
        description: Type publish when mode is publish
        required: false
        type: string

permissions: {}

jobs:
  release_gate:
    name: Verify landed release source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SCOPE: ${{ inputs.scope }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Verify source, package set, and exact CI evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-gate.sh

  release_plan:
    name: Verify release-plz dry-run
    needs: release_gate
    if: ${{ inputs.scope == 'workspace' && needs.release_gate.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: auth-release-plan-${{ inputs.source_sha }}
      cancel-in-progress: false
    env:
      RELEASE_SCOPE: ${{ inputs.scope }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      EXPECTED_RELEASE_SET: ${{ inputs.release_set }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Prepare release-plz branch identity
        run: |
          git fetch origin main --no-tags
          git switch --force-create main "${RELEASE_SHA,,}"
          git branch --set-upstream-to=origin/main main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Run pinned release-plz dry-run
        id: release_plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          config: release-plz.toml
          version: 0.3.160
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify dry-run side effects
        env:
          ACTUAL_RELEASES: ${{ steps.release_plz.outputs.releases }}
        run: bash .github/scripts/release-plan.sh

  release:
    name: Release-plz release
    needs: [release_gate, release_plan]
    if: >-
      ${{ inputs.scope == 'workspace' && inputs.mode == 'publish' &&
          needs.release_gate.result == 'success' &&
          needs.release_plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: auth-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_SCOPE: ${{ inputs.scope }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Reverify release inputs immediately before publication
        run: bash .github/scripts/release-gate.sh
      - name: Prepare release-plz branch identity
        run: |
          git fetch origin main --no-tags
          git switch --force-create main "${RELEASE_SHA,,}"
          git branch --set-upstream-to=origin/main main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Publish approved release set
        id: release_plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          config: release-plz.toml
          version: 0.3.160
      - name: Reconcile published packages and tags
        if: ${{ !cancelled() && steps.release_plz.outcome != 'skipped' }}
        env:
          EXPECTED_RELEASE_SET: ${{ inputs.release_set }}
          ACTUAL_RELEASES: ${{ steps.release_plz.outputs.releases }}
          RELEASE_ACTION_OUTCOME: ${{ steps.release_plz.outcome }}
        run: bash .github/scripts/release-postcondition.sh

  scoped_plan:
    name: Verify exact Cargo package stage
    needs: release_gate
    if: inputs.scope != 'workspace'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_SCOPE: ${{ inputs.scope }}
      RELEASE_SET: ${{ inputs.release_set }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - name: Verify ordinary packages without upload
        run: |
          manifest_args=()
          if [[ "$RELEASE_SCOPE" == account-console ]]; then
            manifest_args=(--manifest-path console/Cargo.toml)
          fi
          while IFS= read -r package; do
            cargo publish "${manifest_args[@]}" --locked --dry-run -p "$package"
            cargo package "${manifest_args[@]}" --locked -p "$package"
          done < <(jq -r '.[].package_name' <<<"$RELEASE_SET")

  scoped_publish:
    name: Publish only exact approved Cargo stage
    needs: [release_gate, scoped_plan]
    if: inputs.scope != 'workspace' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: auth-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SCOPE: ${{ inputs.scope }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - name: Recheck exact source, CI and versions
        run: bash .github/scripts/release-gate.sh
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish selected packages and read back
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          manifest_args=()
          package_dir=target/package
          if [[ "$RELEASE_SCOPE" == account-console ]]; then
            manifest_args=(--manifest-path console/Cargo.toml)
            package_dir=console/target/package
          fi
          while IFS=$'\t' read -r package version; do
            cargo package "${manifest_args[@]}" --locked -p "$package"
            checksum=$(sha256sum "$package_dir/$package-$version.crate" | cut -d ' ' -f 1)
            cargo publish "${manifest_args[@]}" --locked -p "$package"
            curl --user-agent 'LensoAuthConsoleRelease/1.0 (https://github.com/LioRael/lenso-auth-plugin)' --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 \
              "https://crates.io/api/v1/crates/$package/$version" \
              | jq -e --arg version "$version" --arg checksum "$checksum" '.version.num == $version and .version.yanked == false and .version.checksum == $checksum'
          done < <(jq -r '.[] | [.package_name, .version] | @tsv' <<<"$RELEASE_SET")
