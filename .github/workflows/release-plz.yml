name: Release-plz

on:
  workflow_dispatch:
    inputs:
      landed_sha:
        description: Exact immutable SHA already landed on main
        required: true
        type: string
      versions:
        description: Comma-separated exact package@version set approved for this run
        required: true
        type: string
      live:
        description: Publish the approved set (normally false for qualification)
        required: true
        default: false
        type: boolean
      confirm:
        description: Type publish only when live is enabled
        required: false
        type: string

permissions: {}

concurrency:
  group: auth-crates-release-${{ inputs.landed_sha }}
  cancel-in-progress: false

jobs:
  validate-input:
    name: Validate landed release input
    if: ${{ github.repository_owner == 'LioRael' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate immutable SHA and version set
        env:
          LANDED_SHA: ${{ inputs.landed_sha }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          [[ "$LANDED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'landed_sha must be a full 40-character SHA' >&2; exit 1; }
          [[ "$VERSIONS" =~ ^[a-zA-Z0-9_.-]+@[0-9]+\.[0-9]+\.[0-9]+([,][a-zA-Z0-9_.-]+@[0-9]+\.[0-9]+\.[0-9]+)*$ ]] || { echo 'versions must be an exact comma-separated package@version set' >&2; exit 1; }

  dry-run:
    name: Release dry-run
    needs: validate-input
    if: ${{ !inputs.live }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact landed SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.landed_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify SHA is the checked-out commit on main
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.landed_sha }}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${{ inputs.landed_sha }}" origin/main
      - name: Record approved exact version set
        run: echo '${{ inputs.versions }}'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Validate the release without publishing
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish approved crates
    needs: validate-input
    if: ${{ inputs.live && inputs.confirm == 'publish' && github.repository_owner == 'LioRael' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout exact landed SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.landed_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify SHA is the checked-out commit on main
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.landed_sha }}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${{ inputs.landed_sha }}" origin/main
      - name: Record approved exact version set
        run: echo '${{ inputs.versions }}'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Publish approved crates
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
