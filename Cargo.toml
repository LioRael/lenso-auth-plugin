[workspace]
resolver = "2"
members = [
    "crates/lenso-auth-account-plugin",
    "crates/lenso-auth-profile-cache-plugin",
    "crates/lenso-capability-auth-profile-cache",
    "crates/lenso-capability-auth-profile",
    "crates/lenso-auth-profile-plugin",
    "crates/lenso-auth-account-admin-agent-tools-plugin",
    "crates/lenso-auth-anonymous-plugin",
    "crates/lenso-auth-api-token-plugin",
    "crates/lenso-auth-human-api-token-plugin",
    "crates/lenso-auth-device-plugin",
    "crates/lenso-auth-federated-plugin",
    "crates/lenso-auth-oauth-flow-plugin",
    "crates/lenso-auth-oidc-client-plugin",
    "crates/lenso-auth-oidc-plugin",
    "crates/lenso-auth-password-plugin",
    "crates/lenso-auth-phone-plugin",
    "crates/lenso-auth-router-plugin",
    "crates/lenso-auth-sdk",
    "crates/lenso-auth-web-session-plugin",
    "crates/lenso-auth-agent-connection-plugin",
    "crates/lenso-capability-auth",
    "crates/lenso-capability-auth-delegation",
    "crates/lenso-capability-account-admin",
    "crates/lenso-capability-anonymous-auth",
    "crates/lenso-capability-credential-issuer",
    "crates/lenso-capability-credential-state",
    "crates/lenso-capability-api-token-admin",
    "crates/lenso-capability-human-api-token",
    "crates/lenso-capability-identity-directory",
    "crates/lenso-capability-device-auth",
    "crates/lenso-capability-federated-auth",
    "crates/lenso-capability-oauth-flow",
    "crates/lenso-capability-oidc-provider",
    "crates/lenso-capability-password-auth",
    "crates/lenso-capability-phone-auth",
    "crates/lenso-capability-sms-delivery",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-auth-plugin"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = "3.0"
futures = "0.3"
getrandom = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
lenso = "=0.5.28"
lenso-app-plan = "=0.4.6"
lenso-capability-agent-tool-provider = "=0.3.0"
lenso-capability-http-client = "=0.3.3"
lenso-capability-http-endpoint = "=0.3.6"
lenso-capability-secrets = "=0.1.4"
lenso-contract-authoring = "=0.1.2"
lenso-contract-codegen = "=0.10.1"
lenso-contract-runtime = "=0.2.0"
lenso-kernel = "=0.3.12"
lenso-native-adapter = "=0.3.19"
lenso-plugin-authoring = "=0.2.0"
lenso-postgres-kit = "=0.1.1"
lenso-migration = "0.1.0"
lenso-migration-d1 = "0.1.0"
lenso-runner = "=0.2.20"
lenso-test = "=0.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = "2.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[patch.crates-io]
lenso = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-app-plan = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-kernel = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-native-adapter = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-native-adapter-macros = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-plugin-authoring = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-runtime-codec = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-runtime = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-authoring = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-authoring-macros = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-codegen = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }

lenso-runner = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }

lenso-test = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }

lenso-capability-http-endpoint = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }

lenso-capability-http-client = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
